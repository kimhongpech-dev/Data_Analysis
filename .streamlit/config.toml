[theme]
font = "sans-serif"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FB"
textColor = "#1F2937"
borderColor = "#D7DEE8"
linkColor = "#1D4ED8"
codeBackgroundColor = "#F1F5F9"
dataframeHeaderBackgroundColor = "#E8EEF7"
dataframeHeaderTextColor = "#1F2937"
chartCategoricalColors = ["#2563EB", "#0D9488", "#D97706", "#7C3AED", "#DB2777", "#0891B2", "#65A30D"]
chartSequentialColors = ["#EFF6FF", "#DBEAFE", "#BFDBFE", "#93C5FD", "#60A5FA", "#3B82F6", "#2563EB", "#1D4ED8", "#1E40AF", "#1E3A8A"]
chartDivergingColors = ["#7F1D1D", "#B91C1C", "#DC2626", "#F87171", "#FECACA", "#DBEAFE", "#93C5FD", "#3B82F6", "#1D4ED8", "#1E3A8A"]

[theme.dark]
primaryColor = "#2563EB"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111827"
textColor = "#E5E7EB"
borderColor = "#334155"
linkColor = "#60A5FA"
